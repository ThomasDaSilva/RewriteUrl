<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.css">
<script src="https://cdn.datatables.net/1.10.16/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.10.16/js/dataTables.bootstrap.min.js"></script>

<script>
    $(function () {
        var $loader = $('<div class="loader"></div>');
        $('body').append($loader);

        let table = $("#redirection-table").DataTable({
            'order': [[1, "desc"]],
            "paging": true,
            "pagingType": "full_numbers",
            "pageLength": 25,
            'serverSide': true,
            'ajax': {
                'url': '/admin/module/RewriteUrl/manageGoneUrl/get-rules',
                'dataSrc': 'data',
                'type': 'POST',
                'error': function(xhr, error, code) {
                    console.log('AJAX Error:', error, code);
                    console.log('Response:', xhr.responseText);
                },
                'dataSrc': function(json) {
                    console.log('DataTable response:', json);
                    return json.data;
                }
            },
            "rowCallback": function( row, data ) {
                $(row).attr('data-id', data.Id);
            },
            "columns":[
                {
                    'className': 'text-center',
                    'data': 'UrlSource',
                    "width": "50%"
                },
                {
                    'className': 'text-center',
                    'data': 'CreatedAt',
                    "width": "20%",
                    "searchable": false
                },
                {
                    'className': 'text-center',
                    'data': 'UpdatedAt',
                    "width": "20%",
                    "searchable": false
                },
                {
                    'className': 'text-center text-nowrap',
                    'data': 'Actions',
                    "width": "10%",
                    "orderable": false,
                    "searchable": false
                }
            ]
        });

        table.on('draw', function () {
            initDeleteButtons();
        });

        function initDeleteButtons() {
            $(".js_btn_remove_gone_url").off("click").on("click", function(e){
                e.preventDefault();
                var id = $(this).data('id');

                if (!confirm('{intl l="Are you sure you want to delete this Gone URL?" d="rewriteurl.bo.default"}')) {
                    return;
                }

                $loader.show();

                $.ajax({
                    url: '/admin/module/RewriteUrl/manageGoneUrl/delete/' + id,
                    type: 'POST',
                    success: function(){
                        table.ajax.reload();
                        $loader.hide();
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        alert('Error deleting Gone URL');
                        $loader.hide();
                    }
                });
            });
        }
    });
</script>
